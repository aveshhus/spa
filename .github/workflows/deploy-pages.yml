name: Deploy spa website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare static site
        run: npm run pages:prepare
      - name: Build static site
        run: npx next build
        working-directory: .github-pages-source
        env:
          NEXT_PUBLIC_BASE_PATH: /spa
          NEXT_PUBLIC_SITE_URL: https://aveshhus.github.io/spa
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages-source/out
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
